run:
  name: step2_pytorch_fr_and_gradcam
  root: runs/step2
  promotion_root: results/step2
  parent_step1_commit: 4084ee1

# Development runs are identity-aware subsets. Only real/1.0 may be used as a
# full-data paper result.
execution:
  mode: dev
  data_fraction: 0.10
  seed: 42
  execute_stage: false
  write_outputs: false

study_boundary:
  comparison_unit: pretrained_checkpoint
  causal_loss_claim: false
  train_face_recognition_models: false
  exact_origin_fallback: false
  preserve_step1_artifacts_read_only: true

aligned_crops:
  manifest_path: data/interim/common/aligned_112_manifest.parquet
  image_size: [112, 112]
  freeze_before_model_comparison: true
  require_content_sha256: true

models:
  # A candidate is not executable until checkpoint_path, loader_factory,
  # preprocessing, and target_layer are registered and validated.
  selected: [arcface, adaface, magface]
  allow_unverified_metadata: false
  candidates:
    arcface:
      status: checkpoint_required
      framework: pytorch
      backbone: iresnet100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      loader_factory: null
      target_layer: null
      preprocessing:
        input_size: [112, 112]
        color_order: null
        input_range: null
        mean: null
        std: null
    adaface:
      status: checkpoint_required
      framework: pytorch
      backbone: iresnet100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      loader_factory: null
      target_layer: null
      preprocessing:
        input_size: [112, 112]
        color_order: null
        input_range: null
        mean: null
        std: null
    magface:
      status: checkpoint_required
      framework: pytorch
      backbone: iresnet100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      loader_factory: null
      target_layer: null
      preprocessing:
        input_size: [112, 112]
        color_order: null
        input_range: null
        mean: null
        std: null

datasets:
  quantitative: [lfw, survface]
  # RFW remains conditional because all currently declared candidates are
  # MS1MV2 checkpoints. BalancedFace is a development/calibration candidate,
  # not a final test set or an FR-model training request.
  conditional_quantitative: [rfw]
  additional_development_sources: [balancedface]
  gradcam_initial: [lfw]
  lfw:
    manifest_path: data/interim/lfw/face_manifest.csv
    protocol_adapter: lfw_identity_disjoint
  survface:
    training_manifest_path: data/interim/survface/training_manifest.csv
    manifest_path: data/interim/survface/official_manifest.csv
    protocol_adapter: survface_official
    official_manifest_role: evaluation_only
  balancedface:
    status: source_index_only
    source_config_path: configs/datasets/rfw_balancedface.yaml
    experiment_config_path: configs/experiments/rfw_balancedface_quantization.yaml
    role: development_and_calibration_only
    final_evaluation: false
    train_face_recognition_models: false
  rfw:
    status: blocked_checkpoint_overlap
    source_config_path: configs/datasets/rfw_balancedface.yaml
    experiment_config_path: configs/experiments/rfw_balancedface_quantization.yaml
    role: evaluation_test_only
    task: official_10fold_pair_verification
    official_open_set_protocol: false
    checkpoint_overlap_policy: fail_closed

compression:
  baseline_profile: origin_512
  fit_split: development
  families:
    pca:
      source_profile: origin_512
      source_dimension: 512
      dimensions: [384, 256, 128, 64, 32]
    pq:
      source_profile: origin_512
      source_dimension: 512
      settings:
        - {m: 8, nbits: 8}
        - {m: 16, nbits: 8}
        - {m: 32, nbits: 8}
        - {m: 64, nbits: 8}
        - {m: 128, nbits: 8}

model_validation:
  require_checkpoint_sha256: true
  require_preprocessing_sha256: true
  require_raw_embedding: true
  require_raw_norm: true
  require_unit_normalized_embedding: true
  expected_embedding_dimension: 512
  onnx_pytorch_parity:
    enabled_only_for_same_checkpoint: true
    merge_lineages_on_failure: false
    minimum_embedding_cosine: null
    minimum_top1_agreement: null

gradcam:
  enabled: false
  target:
    name: origin_pair_cosine
    gallery_branch_detached: true
    query_branch_only: true
    differentiate_hard_pq: false
  case_selection:
    seed: 42
    samples_per_stratum: 8
    strata:
      - stable
      - high_error
      - threshold_crossing
      - rank_flip
    require_paired_probe_profile_rows: true
  heatmap:
    relu: true
    normalize_to_unit_interval: true
  faithfulness:
    occlusion_fractions: [0.05, 0.10, 0.20]
    baselines: [random, low_saliency]
    random_repeats: 5
    seed: 42

evaluation:
  full_precision_baseline: true
  exact_fallback: false
  compare_frozen_and_recalibrated_thresholds: true
  metrics:
    - angular_error
    - cosine_score_drift
    - rank_flip
    - threshold_crossing
    - dir_at_fpir
    - raw_feature_norm
