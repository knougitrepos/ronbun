run:
  name: thesis3_face_search_v1
  root: runs

dataset:
  # manifest_path: data/face_manifest.csv
  manifest_path: data/interim/lfw/face_manifest.csv
  embedding_column: embedding
  identity_column: identity_id
  image_id_column: image_id

protocol:
  split_seed: 42
  enrollment_counts: [1, 2, 5]
  # gallery_identities_path: data/gallery_identities.txt
  # unknown_unknown_identities_path: data/unknown_unknown_identities.txt
  gallery_identities_path: data/interim/lfw/gallery_identities.txt
  unknown_unknown_identities_path: data/interim/lfw/unknown_unknown_identities.txt

compression:
  profiles:
    - origin_512
    - pca_256
    - pq_auxiliary
  pca:
    n_components: 256
  pq:
    m: 16
    nbits: 8

search:
  # Set these paths to generate artifacts/search/certified_features.csv inside the run.
  # The embedding columns must contain JSON arrays, for example: "[1.0, 0.0]".
  # Optional fallback_embedding columns can contain full-precision JSON arrays
  # for exact fallback when the certified compressed decision is defer.
  # probes_path: data/derived/face_search/probes.csv
  # templates_path: data/derived/face_search/templates.csv
  # Use candidate_set when templates_path contains an approximate pgvector/HNSW
  # candidate subset rather than the full gallery.
  # candidate_scope: exhaustive
  # gallery_size must be a positive integer. It is required for candidate_set
  # and must equal the supplied template count for exhaustive when set.
  # gallery_size: 100000
  # Or set this to pass through a precomputed certified feature table.
  # input_certified_features_path: data/derived/face_search/certified_features.csv
  compression_profile: pca_256
  top_k: 2

calibration:
  target_fpir: 0.01
  models:
    - global_threshold
    - per_compression_threshold
    - logistic_regression
  optional_ablations:
    - shallow_mlp

certification:
  enabled: true
  threshold: 0.8
  fallback_profile: origin_512

output:
  save_csv: true
  save_parquet: true
