{% extends "base.html" %}
{% block title %}Thesis Feature Extraction{% endblock %}
{% block content %}
<h1>Thesis Feature Extraction</h1>

<script>
function showRunningAlert(label) {
    alert(label + ' 작업을 시작합니다.');
}

function checkPCAAndSubmit(form) {
    event.preventDefault();
    fetch('/extract_features/check_pca')
        .then(response => response.json())
        .then(data => {
            if (data.has_pca) {
                form.submit();
            } else {
                alert('PCA-256D 벡터가 DB에 없습니다. 먼저 PCA-256D 생성을 실행하세요.');
            }
        })
        .catch(() => {
            alert('PCA 벡터 확인 중 오류가 발생했습니다.');
        });
}

window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if (params.has('done') && params.has('count')) {
        alert(`${params.get('done')} 완료: ${params.get('count')}건`);
    }
    if (params.has('queued') && params.has('count')) {
        alert(`${params.get('queued')} 큐 등록: ${params.get('count')}건`);
    }
}
</script>

<form action="/extract_features/origin" method="post" style="display:inline-block;margin-right:10px;" onsubmit="showRunningAlert('ArcFace 512D 원본 추출')">
    <button type="submit">ArcFace 512D 원본 추출</button>
</form>

<form action="/extract_features/pca" method="post" style="display:inline-block;margin-right:10px;" onsubmit="showRunningAlert('PCA-256D 생성')">
    <button type="submit">PCA-256D 생성</button>
</form>

<form action="/extract_features/pq" method="post" style="display:inline-block;" onsubmit="checkPCAAndSubmit(this)">
    <button type="submit">PCA-256D + PQ 생성</button>
</form>

<br><br>
<a href="/" class="main-btn">메인으로</a>
{% endblock %}
