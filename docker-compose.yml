version: "3"  # 또는 3.x

services:
  db:
    # Postgres 15 버전에 pgvector를 직접 설치하거나,
    # ankane/pgvector 이미지 중 Postgres 15 기반 버전을 사용
    # 예: ankane/pgvector:15, ankane/pgvector:latest 등
    image: ankane/pgvector:latest
    container_name: pgvector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # 다른 서비스(grafana) 생략 가능
  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - db

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark  # Spark 전용 Dockerfile
    container_name: spark
    ports:
      - "8000:8000"
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8000
    command: ["/bin/sh", "-c", "/opt/spark/bin/spark-class org.apache.spark.deploy.master.Master"]

  spark_analysis:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      - spark
      - db
    container_name: spark_analysis
    volumes:
      - ./spark_analyze:/opt/spark_analyze
    command: [ "/opt/spark/bin/spark-submit", "--conf", "spark.driver.extraClassPath=/opt/spark/jars/postgresql-42.6.0.jar", "/opt/spark_analyze/vector_similarity.py" ]

volumes:
  redis_data:
    driver: local


