run:
  name: thesis3_survface_official_v1
  root: runs/survface

dataset:
  name: qmul_survface_v1
  manifest_path: data/interim/survface/official_manifest.csv
  gallery_path: data/interim/survface/gallery.csv
  registered_probes_path: data/interim/survface/registered_probes.csv
  unknown_unknown_probes_path: data/interim/survface/unknown_unknown_probes.csv
  embedding_column: embedding
  identity_column: identity_id
  image_id_column: image_id

protocol:
  adapter: survface_official
  preserve_protocol_index: true
  known_unknown_count: 0
  enrollment_policy: official_all
  rank: 20
  fpir_targets: [0.1, 0.2, 0.3]

compression:
  # The official test set must never fit PCA/PQ. Notebook 02 requires this
  # environment variable to point to a frozen development-trained run.
  fit_policy: external_frozen_run
  source_run_env: RONBUN_SURVFACE_COMPRESSION_SOURCE_RUN
  profiles:
    - origin_512
    - pca_256
    - pq_auxiliary
  pca:
    n_components: 256
  pq:
    m: 16
    nbits: 8

search:
  compression_profile: pca_256
  top_k: 20
  exact_baseline: true
  approximate_backend: pgvector_hnsw

calibration:
  # Threshold/calibrator fitting also comes from a development/calibration run;
  # the SurvFace official test rows are evaluation-only.
  fit_policy: external_frozen_run
  source_run_env: RONBUN_SURVFACE_CALIBRATION_SOURCE_RUN
  target_fpir: 0.1
  evaluation_split: test
  models:
    - global_threshold
    - per_compression_threshold
    - logistic_regression

certification:
  enabled: true
  threshold: 0.8
  fallback_profile: origin_512
  candidate_scope: exhaustive_only

output:
  save_csv: true
  save_parquet: true
