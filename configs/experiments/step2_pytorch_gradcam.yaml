run:
  name: step2_pytorch_fr_and_gradcam
  root: runs
  dataset_id: lfw
  dataset_date_dir_template: "{dataset_id}_{date}"
  partition_by_date: false
  promotion_root: results/step2
  parent_step1_commit: 4084ee1

# Development runs are identity-aware subsets. Only real/1.0 may be used as a
# full-data paper result.
execution:
  model_profile: arcface_ms1mv3_r100
  mode: real
  data_fraction: 1.0
  seed: 42
  # Full LFW/SurvFace rerun profile. Commit this exact local-notebook
  # configuration before execution so allow_dirty=false pins the code state.
  # Existing canonical Step 4 bundles are never replaced implicitly.
  execute_stage: true
  write_outputs: true
  overwrite: false
  allow_dirty: false
  device: cuda

study_boundary:
  comparison_unit: pretrained_checkpoint
  causal_loss_claim: false
  train_face_recognition_models: false
  exact_origin_fallback: false
  preserve_step1_artifacts_read_only: true

aligned_crops:
  bundle_dir: data/interim/common/aligned_112
  faces_path: data/interim/common/aligned_112/aligned_faces.npy
  index_path: data/interim/common/aligned_112/aligned_index.csv
  failed_samples_path: data/interim/common/aligned_112/failed_samples.csv
  bundle_manifest_path: data/interim/common/aligned_112/bundle_manifest.json
  providers: [CUDAExecutionProvider, CPUExecutionProvider]
  required_primary_provider: CUDAExecutionProvider
  image_size: [112, 112]
  source_color_order: rgb
  dtype: uint8
  layout: nhwc
  freeze_before_model_comparison: true
  require_content_sha256: true

# One canonical working result is used for the sequential Step 2 notebooks.
# Completed RunStore runs remain immutable. A changed open-set calibration is
# recorded as a new RunStore run/config, not as a second result in one run.
workflow:
  artifact_subdir: artifacts/step2_workflow
  selected_manifest_path: selected_manifest.csv
  freeze_manifest_path: freeze_manifest.json
  prepared_population_dir: prepared_population
  saliency_population_dir: saliency_population
  saliency_validation_path: saliency_validation.json
  paired_metrics_path: paired_embedding_metrics.csv
  retrieval_metrics_path: retrieval_metrics.csv
  rfw_custom_demographic_summary_path: rfw_custom_demographic_summary.csv
  origin_score_audit_path: origin_open_set_score_audit.csv
  calibration_diagnostics_path: origin_calibration_diagnostics.json
  frozen_codec_manifest_path: frozen_codec_manifest.json
  geometry_joined_metrics_path: saliency_geometry_join.csv
  retrieval_joined_metrics_path: saliency_retrieval_join.csv
  representative_case_candidates_path: representative_case_candidates.csv
  persist_large_join_artifacts: true
  geometry_association_path: saliency_geometry_associations.csv
  retrieval_association_path: saliency_retrieval_associations.csv
  representative_cases_path: representative_cases.csv
  figure_dir: figures

models:
  registry_root: runs/step2/model_registry
  validation_root: runs/step2/model_validation
  model_uid: null
  # Each profile is a checkpoint-level identity: family + architecture +
  # training dataset + preprocessing + target layer.  A profile becomes
  # executable only after the matching checkpoint is downloaded, hashed,
  # registered as ModelSpec, and smoke-tested.
  #
  # comparison_unit remains pretrained_checkpoint; causal_loss_claim is false.

  selected_profiles:
    - arcface_ms1mv3_r100
    - adaface_ms1mv3_r100
    - magface_ms1mv2_iresnet100
    - edgeface_webface12m_xs_gamma_06

  bridge_profiles:
    - adaface_ms1mv2_r100

  blocked_profiles:
    - arcface_ms1mv2_r100

  allow_unverified_metadata: false

  profiles:
    arcface_ms1mv3_r100:
      family: arcface
      role: primary
      status: implementation_ready_checkpoint_required
      framework: pytorch
      architecture: iresnet100
      architecture_display_name: r100
      training_dataset: ms1mv3
      embedding_dim: 512
      checkpoint_path: null
      checkpoint_source_url: null
      implementation_repository: https://github.com/deepinsight/insightface/tree/master/recognition/arcface_torch
      checkpoint_source_page: https://github.com/deepinsight/insightface/tree/master/recognition/arcface_torch#model-zoo
      loader_factory: research.embeddings.pytorch.official_loaders:load_arcface_checkpoint
      target_layer: layer4.2.conv2
      run_compression: true
      run_gradcam: true
      preprocessing:
        input_size: [112, 112]
        model_color_order: rgb
        input_range: [-1.0, 1.0]
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]

    adaface_ms1mv3_r100:
      family: adaface
      role: primary
      status: implementation_ready_checkpoint_required
      framework: pytorch
      architecture: ir_101
      architecture_display_name: r100
      training_dataset: ms1mv3
      embedding_dim: 512
      checkpoint_path: null
      checkpoint_source_url: https://drive.google.com/file/d/1hRI8YhlfTx2YMzyDwsqLTOxbyFVOqpSI/view
      implementation_repository: https://github.com/mk-minchul/AdaFace
      checkpoint_source_page: https://github.com/mk-minchul/AdaFace#pretrained-models
      loader_factory: research.embeddings.pytorch.official_loaders:load_adaface_checkpoint
      target_layer: body.48.res_layer.4
      run_compression: true
      run_gradcam: true
      preprocessing:
        input_size: [112, 112]
        model_color_order: bgr
        input_range: [-1.0, 1.0]
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]

    magface_ms1mv2_iresnet100:
      family: magface
      role: primary
      status: implementation_ready_checkpoint_required
      framework: pytorch
      architecture: iresnet100
      architecture_display_name: iresnet100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      checkpoint_source_url: null
      implementation_repository: https://github.com/IrvingMeng/MagFace
      checkpoint_source_page: https://github.com/IrvingMeng/MagFace#model-zoo
      loader_factory: research.embeddings.pytorch.official_loaders:load_magface_checkpoint
      target_layer: layer4.2.conv2
      run_compression: true
      run_gradcam: true
      preprocessing:
        # MagFace 공식 inference (gen_feat.py): PIL(RGB) → ToTensor([0,1]) →
        # Normalize(mean=0, std=1).  Adapter는 (x - mean) / std를 계산하므로
        # mean=0, std=255로 두면 uint8 → [0,1] 변환과 동일하다.
        input_size: [112, 112]
        model_color_order: rgb
        input_range: [0.0, 1.0]
        mean: [0.0, 0.0, 0.0]
        std: [255.0, 255.0, 255.0]

    edgeface_webface12m_xs_gamma_06:
      family: edgeface
      role: external_model_generalization
      status: implementation_ready_checkpoint_available_local
      framework: pytorch
      architecture: edgeface_xs_gamma_06
      architecture_display_name: EdgeFace-XS gamma=0.6
      training_dataset: webface12m
      embedding_dim: 512
      checkpoint_path: models/edgeface/edgeface_xs_gamma_06.pt
      expected_checkpoint_sha256: 5ae7504cd9aee0a5d52c2115fd2eb66b0985dd1730f40134b5854e0cb658ce16
      checkpoint_source_url: https://gitlab.idiap.ch/bob/bob.paper.tbiom2023_edgeface/-/raw/master/checkpoints/edgeface_xs_gamma_06.pt
      implementation_repository: https://gitlab.idiap.ch/bob/bob.paper.tbiom2023_edgeface
      checkpoint_source_page: https://gitlab.idiap.ch/bob/bob.paper.tbiom2023_edgeface/-/tree/master/checkpoints?ref_type=heads
      loader_factory: research.embeddings.pytorch.official_loaders:load_edgeface_checkpoint
      target_layer: model.stages.3.blocks.2.convs.2
      run_compression: true
      run_gradcam: true
      preprocessing:
        input_size: [112, 112]
        model_color_order: rgb
        input_range: [-1.0, 1.0]
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]

    adaface_ms1mv2_r100:
      family: adaface
      role: bridge
      status: implementation_ready_checkpoint_required
      framework: pytorch
      architecture: ir_101
      architecture_display_name: r100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      checkpoint_source_url: https://drive.google.com/file/d/1m757p4-tUU5xlSHLaO04sqnhvqankimN/view
      implementation_repository: https://github.com/mk-minchul/AdaFace
      checkpoint_source_page: https://github.com/mk-minchul/AdaFace#pretrained-models
      loader_factory: research.embeddings.pytorch.official_loaders:load_adaface_checkpoint
      target_layer: body.48.res_layer.4
      run_compression: true
      run_gradcam: false
      preprocessing:
        input_size: [112, 112]
        model_color_order: bgr
        input_range: [-1.0, 1.0]
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]

    arcface_ms1mv2_r100:
      family: arcface
      role: blocked
      status: blocked_no_verified_public_checkpoint
      blocked_reason: >
        재현 가능한 공식 공개 checkpoint 경로가 현재 확인되지 않은 profile입니다.
        InsightFace 공식 OneDrive의 공개 목록에서 MS1MV2 ArcFace R100 .pth를
        확인·확보할 수 없으므로, 재현 가능한 공개 checkpoint로 간주하지 않습니다.
      framework: pytorch
      architecture: iresnet100
      architecture_display_name: r100
      training_dataset: ms1mv2
      embedding_dim: 512
      checkpoint_path: null
      checkpoint_source_url: null
      implementation_repository: https://github.com/deepinsight/insightface/tree/master/recognition/arcface_torch
      checkpoint_source_page: null
      loader_factory: research.embeddings.pytorch.official_loaders:load_arcface_checkpoint
      target_layer: layer4.2.conv2
      run_compression: false
      run_gradcam: false
      preprocessing:
        input_size: [112, 112]
        model_color_order: rgb
        input_range: [-1.0, 1.0]
        mean: [127.5, 127.5, 127.5]
        std: [127.5, 127.5, 127.5]

datasets:
  quantitative: [lfw, survface, rfw_custom]
  # RFW is an additional 1:1 verification diagnostic, not an open-set test.
  # MS1M checkpoints have known overlap risk, while EdgeFace/WebFace12M lacks
  # verified non-overlap evidence. Therefore RFW is reportable only as a
  # supplementary diagnostic and is never promoted to the headline set.
  conditional_quantitative: [rfw]
  additional_development_sources: []
  saliency_population_initial: [lfw, survface, rfw_custom]
  lfw:
    manifest_path: data/interim/lfw/face_manifest.csv
    aligned_bundle_dir: data/interim/common/aligned_112
    landmark_region_bundle_dir: data/interim/step4/lfw/landmark_regions_106
    preprocessing_mode: detect_and_align
    require_full_coverage: false
    gallery_identities_path: data/interim/lfw/gallery_identities.txt
    unknown_unknown_identities_path: data/interim/lfw/unknown_unknown_identities.txt
    protocol_adapter: lfw_identity_disjoint
  survface:
    training_manifest_path: data/interim/survface/training_manifest.csv
    manifest_path: data/interim/survface/official_manifest.csv
    aligned_bundle_dir: data/interim/step4/survface/aligned_112
    landmark_region_bundle_dir: data/interim/step4/survface/landmark_regions_106
    # QMUL-SurvFace protocol files already contain cropped face thumbnails.
    # Running a face detector on these low-resolution crops rejects nearly all
    # valid protocol rows, so every source uses one recorded resize policy.
    preprocessing_mode: official_face_crop_resize
    require_full_coverage: true
    protocol_adapter: survface_official
    official_manifest_role: evaluation_only
  rfw_custom:
    dataset_id: rfw-custom-v1
    manifest_path: data/raw/RFW/images/test.tar.gz
    source_archive_sha256: 2ec1875599d01888431be83fe51ed9614188a026539fb970653081ca0fbf3e39
    aligned_bin_archive_path: data/raw/RFW/bin_for_mxnet/RFW_test.tar.gz
    aligned_bin_archive_sha256: 8259e53ab1b542a9747335f34b2ae48e22a675bce472e391d6b94bc900fde572
    aligned_bundle_dir: data/interim/step4/rfw_custom/aligned_112
    landmark_region_bundle_dir: data/interim/step4/rfw_custom/landmark_regions_106
    preprocessing_mode: rfw_official_aligned_bin
    require_full_coverage: true
    protocol_adapter: rfw_custom_identity_disjoint_v1
    official_protocol_claim: false
    checkpoint_overlap_status: UNKNOWN
    strict_unseen_identity_evidence: false
    protocol:
      seed: 42
      development_fraction: 0.40
      calibration_fraction: 0.20
      gallery_identity_count_per_group: 300
      unknown_unknown_fraction: 0.50
      enrollment_count: 1
      group_balanced: true
      cross_group_source_identity_policy: exclude_from_custom_protocol
  balancedface:
    status: deferred_by_step7_scope
    source_config_path: configs/datasets/rfw_balancedface.yaml
    experiment_config_path: configs/experiments/rfw_balancedface_quantization.yaml
    role: deferred_not_used
    final_evaluation: false
    train_face_recognition_models: false
  rfw:
    status: additional_verification_diagnostic
    source_config_path: configs/datasets/rfw_balancedface.yaml
    experiment_config_path: configs/experiments/rfw_balancedface_quantization.yaml
    role: evaluation_test_only
    task: official_10fold_pair_verification
    official_open_set_protocol: false
    checkpoint_overlap_policy: fail_closed
    headline_evaluation: false
    compression_fit: false
    compression_application: frozen_codec_transfer_only

compression:
  baseline_profile: origin_512
  fit_split: development
  families:
    pca:
      source_profile: origin_512
      source_dimension: 512
      dimensions: [384, 256, 128, 64, 32]
    pq:
      source_profile: origin_512
      source_dimension: 512
      settings:
        - { m: 8, nbits: 8 }
        - { m: 16, nbits: 8 }
        - { m: 32, nbits: 8 }
        - { m: 64, nbits: 8 }
        - { m: 128, nbits: 8 }

model_validation:
  require_checkpoint_sha256: true
  require_preprocessing_sha256: true
  require_raw_embedding: true
  require_raw_norm: true
  require_unit_normalized_embedding: true
  expected_embedding_dimension: 512
  onnx_pytorch_parity:
    enabled_only_for_same_checkpoint: true
    merge_lineages_on_failure: false
    minimum_embedding_cosine: null
    minimum_top1_agreement: null

gradcam:
  # Runtime readiness is derived from verified checkpoint, preprocessing,
  # target-layer, aligned-crop, mask-bundle, and provider checks. A separate
  # manually maintained execution_ready flag is intentionally not used.
  study_enabled: true
  role: origin_population_feature
  stage_order:
    - pass_a_origin_embedding
    - leave_one_out_identity_template
    - pass_b_population_gradcam
    - origin_embedding_compression
    - strict_saliency_compression_join
    - representative_case_visualization
  population:
    pass_a_origin_embedding_coverage: all_selected_samples
    pass_b_saliency_coverage: all_target_eligible_samples
    retain_all_selected_sample_rows: true
    singleton_identity_policy: record_ineligible
    unlabeled_sample_policy: record_ineligible
    ineligible_rows_must_include_reason: true
    saliency_sample_cap:
      lfw: null
      survface: null
      rfw_custom: 2048
    sampling_unit: sample_id
    survface_sampling_strata: [registered_probe, unknown_unknown_probe]
    rfw_custom_sampling_strata: [rfw_group, protocol_role]
  two_pass_extraction:
    pass_a:
      output: origin_embedding_512
      backward: false
      coverage: all_selected_samples
    template_build:
      source: pass_a_origin_embedding
      leave_query_out: true
      minimum_same_identity_samples: 2
      normalize_template: true
    pass_b:
      source_images: pass_a_selected_samples
      coverage: all_target_eligible_samples
      require_pass_a_embedding_match: true
      minimum_pass_repeat_cosine: 0.99999
  target:
    name: origin_leave_one_out_identity_cosine
    embedding_space: origin_512
    reference_branch_detached: true
    query_branch_only: true
    leave_query_out: true
    template_scope_keys:
      - dataset_id
      - split
      - identity_id
      - model_uid
      - selected_manifest_sha256
    differentiate_hard_pq: false
    analysis_conditioning: identity_label_required
  extraction:
    embedding_batch_size: 64
    gradcam_batch_size: 4
    shard_size: 2048
    capture_intermediates: false
  persistence:
    format: immutable_shards
    heatmap_resolution: native_target_layer
    persist_normalized_heatmap: true
    persist_raw_cam: true
    persist_relu_cam: true
    persist_channel_weights: true
    persist_pass_b_embeddings: true
    persist_scalar_features: true
    persist_full_activations: false
    persist_full_gradients: false
    full_activation_gradient_policy: transient_or_explicit_debug_subset_only
  regions:
    mask_bundle_path: null
    landmark_model_path: null
    landmark_topology: insightface-2d106-semantic-v1
    quadrants: true
    semantic_regions:
      - left_eye
      - right_eye
      - nose
      - mouth
      - left_cheek
      - right_cheek
      - jaw
      - outside_face
    require_explicit_landmark_or_face_masks: true
    infer_missing_semantic_masks: false
  faithfulness:
    enabled: true
    # LFW is computed inline for all eligible rows. SurvFace is derived from
    # immutable heatmaps with bounded forward-only occlusion evaluation.
    enabled_datasets: [lfw]
    coverage: all_target_eligible_samples
    derived_stratified_datasets: [survface]
    derived_maximum_samples:
      survface: 2048
    derived_strata:
      - protocol_role
      - raw_embedding_norm_within_role_quartile
      - gradcam_target_score_within_role_quartile
    primary_occlusion_fraction: 0.10
    baselines: [random, low_saliency]
    random_repeats: 5
    seed: 42
    random_seed_unit: sample_id
  representative_case_visualization:
    role: visualization_only
    run_after_population_join: true
    regenerate_gradcam: false
    seed: 42
    samples_per_stratum: 8
    threshold_policy: frozen_origin
    strata:
      - stable
      - high_error
      - threshold_crossing
      - rank_flip

joint_analysis:
  join_stage: after_origin_embedding_compression
  strict_join: true
  join_keys:
    - extraction_uid
    - dataset_id
    - sample_id
    - model_uid
  lineage:
    required_key: origin_embedding_artifact_uid
    compression_source_must_match_saliency_origin: true
    reject_missing_or_mismatched_lineage: true
  prohibit_saliency_embedding_concatenation: true
  association:
    geometry_stratify_by:
      - dataset_id
      - model_uid
      - compression_family
      - compression_profile
    retrieval_stratify_by:
      - dataset_id
      - model_uid
      - compression_family
      - compression_profile
      - search_mode
      - threshold_source_split
      - evaluation_split
      - threshold_policy
      - is_mated
    bootstrap_unit: identity_id
    bootstrap_method: identity_cluster
    bootstrap_repeats: 500
    pool_models: false
    pool_compression_profiles: false

evaluation:
  full_precision_baseline: true
  exact_fallback: false
  compare_frozen_and_recalibrated_thresholds: true
  target_fpir: 0.01
  survface_target_fpir: 0.10
  rfw_custom_target_fpir: 0.10
  # v4 compact postprocessing reports both operating points from one set of
  # search scores. The scalars above remain the source-run primary targets.
  reported_target_fpirs: [0.10, 0.01]
  survface_calibration_gallery_identities: 3000
  survface_calibration_protocol: training_3000_half_gallery_v2
  survface_threshold_selection: non_mated_only
  top_k: 20
  lfw_enrollment_count: 5
  calibration_gallery_identities: 20
  rfw_custom_calibration_gallery_identities: 80
  rfw_custom_enrollment_count: 1
  metrics:
    - angular_error
    - cosine_score_drift
    - rank_flip
    - threshold_crossing
    - dir_at_fpir
    - raw_feature_norm
