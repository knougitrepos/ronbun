{% extends "base.html" %}
{% block title %}Wavelet, DCT 변환 예시{% endblock %}
{% block content %}
{# Wavelet, DCT 변환 예시 시각화 페이지 템플릿 #}
<h2>Wavelet, DCT 변환 예시</h2>
<form method="post" enctype="multipart/form-data">
    <input type="file" name="image" accept="image/*" required>
    <button type="submit">업로드 및 변환</button>
</form>
{% if result_imgs %}
<div style="display:flex;flex-wrap:wrap;gap:2rem;margin-top:2rem;justify-content:center;">
    {% for title, img_url in result_imgs %}
    <div style="text-align:center;">
        <div><b>{{ title }}</b></div>
        <a href="{{ img_url }}" target="_blank">
            <img src="{{ img_url }}" alt="변환 결과 이미지" style="max-width:240px;max-height:240px;border:1px solid #ccc;">
        </a>
        <div style="font-size:0.9em;color:#666;">이미지를 클릭하면 크게 볼 수 있습니다.</div>
    </div>
    {% endfor %}
</div>
{% endif %}
<div style="margin-top:2rem;text-align:center;">
    <a href="/extract" class="main-btn" style="background:#888;">뒤로가기</a>
</div>
{% endblock %}
